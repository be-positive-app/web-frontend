name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Runs tsc -b, vite build and the prerender step, so a route missing from
      # routes.json or a meta tag the prerender cannot find fails here.
      - run: npm run build
