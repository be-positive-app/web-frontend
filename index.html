<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0808c1" />
    <meta name="robots" content="index, follow" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Self-hosted Manrope (variable, 400-800) — @font-face lives in src/index.css.
         Preloaded because the hero headline is the LCP element. -->
    <link
      rel="preload"
      href="/fonts/manrope-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Title, description, keywords, canonical, social tags & JSON-LD are overwritten
         from src/config/siteMeta.ts at dev/build (see vite.config.ts inject-site-meta). -->
    <title>Be Positive — Life Planner</title>
    <meta
      name="description"
      content="Plan your day, stay focused, and track your progress with Be Positive Life Planner"
    />
    <meta name="keywords" content="daily planner app, life planner app, task manager app" />
    <link rel="canonical" href="https://bepositive.cc/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Be Positive" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://bepositive.cc/" />
    <meta property="og:title" content="Be Positive — Life Planner" />
    <meta
      property="og:description"
      content="Plan your day, stay focused, and track your progress with Be Positive Life Planner"
    />
    <meta property="og:image" content="https://bepositive.cc/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Be Positive — Life Planner" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Be Positive — Life Planner" />
    <meta
      name="twitter:description"
      content="Plan your day, stay focused, and track your progress with Be Positive Life Planner"
    />
    <meta name="twitter:image" content="https://bepositive.cc/og-image.png" />

    <script type="application/ld+json">
      {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
